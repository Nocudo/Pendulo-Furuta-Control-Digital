[platformio]
src_dir = Core/Src
include_dir = Core/Inc

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = stm32cube
upload_protocol = mbed
upload_port = F:
monitor_port = COM13
monitor_speed = 115200
build_flags =
    -ICore/Inc
    -Wl,-u,_printf_float
    -DSTM32F446xx
    -DHSE_VALUE=8000000U
